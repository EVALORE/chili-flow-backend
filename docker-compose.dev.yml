services:
  postgres-db:
    image: postgres:latest
    container_name: chili-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PSQL_PASSWORD}
      POSTGRES_DB: ${PSQL_DATABASE}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql1

volumes:
  postgres_data:
